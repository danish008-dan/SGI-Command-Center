<!-- templates/login.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGI Command Center - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link href="/static/css/style.css?v=2" rel="stylesheet">
</head>
<body>

    <!-- Transition Overlay (Starts active, fades away on load) -->
    <div class="transition-overlay active" id="transitionOverlay"></div>

    <!-- Added main-container and login-page classes to trigger the CSS background image -->
    <div class="main-container login-page">

        <!-- Header (Empty for grid alignment) -->
        <header></header>

        <!-- Centered Login Area -->
        <main class="home-bg">
            <!-- Using the premium glass-card class for the frosted glass effect -->
            <div class="glass-card text-center" data-aos="fade-down">
                <div class="mb-4">
                    <h3 class="mb-2">SGI Command Center</h3>
                    <p class="text-muted mb-0">Developed By Danish Khatri</p>
                </div>

                <div id="alertBox" class="alert alert-danger d-none" role="alert"></div>

                <form id="loginForm">
                    <div class="mb-3 text-start">
                        <label class="form-label">Email address</label>
                        <input type="email" class="form-control" id="email" name="email" placeholder="admin@cms.com" required>
                    </div>

                    <!-- Password Field with Eye Icon -->
                    <div class="mb-3 text-start">
                        <label class="form-label">Password</label>
                        <div class="input-group">
                            <input type="password" class="form-control" id="password" name="password" placeholder="admin123" required>
                            <button class="btn btn-outline-secondary" type="button" id="togglePassword" style="border-color: rgba(0,0,0,0.10);">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary" id="loginBtn">Login</button>
                    </div>
                </form>
            </div>
        </main>

        <!-- Footer -->
        <footer class="custom-footer text-center">
            <small>&copy; 2026 SGI Command Center. All Rights Reserved.</small>
        </footer>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init();

        // Remove transition overlay on load (Fade out effect)
        window.addEventListener('load', function() {
            setTimeout(() => {
                document.getElementById("transitionOverlay").classList.remove("active");
            }, 100);
        });

        // Toggle Password Visibility (Eye Icon)
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');

        togglePassword.addEventListener('click', function () {
            // Toggle the type attribute
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);

            // Toggle the eye icon
            this.querySelector('i').classList.toggle('bi-eye');
            this.querySelector('i').classList.toggle('bi-eye-slash');
        });

        // Login Form Submit Logic
        document.getElementById("loginForm").addEventListener("submit", async function(e) {
            e.preventDefault();

            const btn = document.getElementById("loginBtn");
            btn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Logging in...';
            btn.disabled = true;

            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            const formData = new URLSearchParams();
            formData.append("email", email);
            formData.append("password", password);

            try {
                const response = await fetch("/login", {
                    method: "POST",
                    body: formData
                });

                const data = await response.json();

                if (data.success) {
                    // 1. Save token to browser local storage
                    localStorage.setItem("access_token", data.token);
                    alert(data.message);

                    // 2. Redirect based on role
                    if (data.role === "Admin") {
                        window.location.href = "/admin/jarvis";
                    } else if (data.role === "Student") {
                        window.location.href = "/student/dashboard";
                    } else if (data.role === "Teacher") {
                        window.location.href = "/teacher/dashboard";
                    } else if (data.role === "HOD") {
                        window.location.href = "/hod/dashboard";
                    } else if (data.role === "Principal") {
                        window.location.href = "/principal/dashboard";
                    }
                } else {
                    document.getElementById("alertBox").textContent = data.message;
                    document.getElementById("alertBox").classList.remove("d-none");
                    btn.innerHTML = 'Login';
                    btn.disabled = false;
                }
            } catch (error) {
                document.getElementById("alertBox").textContent = "Network error. Is the server running?";
                document.getElementById("alertBox").classList.remove("d-none");
                btn.innerHTML = 'Login';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
