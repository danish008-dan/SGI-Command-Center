{% extends "principal/principal_layout.html" %}
{% block title %}Notices & Events Oversight{% endblock %}
{% block page_title %}Notices & Events{% endblock %}
{% block content %}
<div class="container-fluid" id="noticesOversight">
    <div class="text-center py-5"><div class="spinner-border text-primary"></div></div>
</div>
{% endblock %}
{% block custom_js %}
<script>
async function loadData() {
    const res = await fetch("/principal/api/notices", { headers: { "Authorization": "Bearer " + localStorage.getItem('access_token') } });
    const s = await res.json();
    const c = document.getElementById("noticesOversight");

    // =====================================================
    // Helper: render an empty-state row
    // =====================================================
    const emptyRow = (cols, msg) => `<tr><td colspan="${cols}" class="text-center text-muted py-3">${msg}</td></tr>`;

    // =====================================================
    // Helper: format a date string safely
    // =====================================================
    const fmtDate = (d) => {
        if (!d) return '';
        try { return new Date(d).toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' }); }
        catch (e) { return d; }
    };

    // =====================================================
    // Helper: badge color by notice/event status
    // =====================================================
    const statusBadge = (status) => {
        const cls = {
            'Published': 'bg-success',
            'Pending': 'bg-warning text-dark',
            'Approved': 'bg-primary',
            'Expired': 'bg-secondary',
            'Cancelled': 'bg-danger',
            'Draft': 'bg-light text-dark'
        }[status] || 'bg-info';
        return `<span class="badge ${cls}">${status || 'N/A'}</span>`;
    };

    // =====================================================
    // Admin-Created Notices table rows
    // =====================================================
    let noticesRows;
    if (s.admin_notices && s.admin_notices.length > 0) {
        noticesRows = s.admin_notices.map(n => `
            <tr>
                <td><b>${n.title}</b>${n.attachment_path ? ' <a href="${n.attachment_path}" target="_blank" class="text-muted ms-1"><i class="bi bi-paperclip"></i></a>' : ''}</td>
                <td><span class="badge bg-info">${n.category || 'General'}</span></td>
                <td>${statusBadge(n.status)}</td>
                <td>${n.target_audience || 'All'}</td>
                <td>${n.creator_name || 'N/A'}</td>
                <td>${fmtDate(n.posted_on)}</td>
            </tr>
        `).join('');
    } else {
        noticesRows = emptyRow(6, 'No Admin-created notices available.');
    }

    // =====================================================
    // Admin-Created Events table rows
    // =====================================================
    let eventsRows;
    if (s.admin_events && s.admin_events.length > 0) {
        eventsRows = s.admin_events.map(e => `
            <tr>
                <td><b>${e.event_name}</b></td>
                <td>${e.venue || 'N/A'}</td>
                <td>${fmtDate(e.event_date)}</td>
                <td>${statusBadge(e.status)}</td>
                <td>${e.target_audience || 'All'}</td>
                <td>${e.organizer || 'N/A'}</td>
            </tr>
        `).join('');
    } else {
        eventsRows = emptyRow(6, 'No events available.');
    }

    c.innerHTML = `
        <!-- =================================================
             EXISTING: 3 Stat Cards (unchanged)
             ================================================= -->
        <div class="row g-4 mb-4">
            <div class="col-md-4" data-aos="zoom-in">
                <div class="card border-0 shadow-sm rounded-4 p-3 bg-primary text-white h-100">
                    <div><p class="mb-1 opacity-75">Published Notices</p><h2 class="mb-0">${s.published_notices}</h2></div>
                </div>
            </div>
            <div class="col-md-4" data-aos="zoom-in" data-aos-delay="100">
                <div class="card border-0 shadow-sm rounded-4 p-3 bg-warning text-white h-100">
                    <div><p class="mb-1 opacity-75">Pending Approvals</p><h2 class="mb-0">${s.pending_notices}</h2>
                    <a href="/principal/notice-approvals" class="text-white mt-2 d-block">Go to Approvals <i class="bi bi-arrow-right"></i></a></div>
                </div>
            </div>
            <div class="col-md-4" data-aos="zoom-in" data-aos-delay="200">
                <div class="card border-0 shadow-sm rounded-4 p-3 bg-success text-white h-100">
                    <div><p class="mb-1 opacity-75">Upcoming Events</p><h2 class="mb-0">${s.upcoming_events}</h2></div>
                </div>
            </div>
        </div>

        <!-- =================================================
             NEW: Admin-Created Notices table (Issue 3 fix)
             Shows all non-Draft notices created by Admin users.
             The Principal has institution-wide oversight visibility.
             ================================================= -->
        <div class="row g-4 mb-4">
            <div class="col-12" data-aos="fade-up">
                <div class="card shadow-sm">
                    <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
                        <h5 class="mb-0"><i class="bi bi-megaphone-fill text-primary"></i> Admin-Created Notices</h5>
                        <small class="text-muted">Showing the 20 most recent non-Draft notices</small>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th>Title</th>
                                        <th>Category</th>
                                        <th>Status</th>
                                        <th>Audience</th>
                                        <th>Created By</th>
                                        <th>Date</th>
                                    </tr>
                                </thead>
                                <tbody>${noticesRows}</tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- =================================================
             NEW: Admin-Created Events table (Issue 3 fix)
             Shows all events (Admin is the primary event creator).
             ================================================= -->
        <div class="row g-4">
            <div class="col-12" data-aos="fade-up" data-aos-delay="100">
                <div class="card shadow-sm">
                    <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
                        <h5 class="mb-0"><i class="bi bi-calendar-event-fill text-success"></i> Events</h5>
                        <small class="text-muted">Showing the 20 most recent events</small>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th>Event Name</th>
                                        <th>Venue</th>
                                        <th>Date</th>
                                        <th>Status</th>
                                        <th>Audience</th>
                                        <th>Organizer</th>
                                    </tr>
                                </thead>
                                <tbody>${eventsRows}</tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>`;
    AOS.init();
}
loadData();
</script>
{% endblock %}
