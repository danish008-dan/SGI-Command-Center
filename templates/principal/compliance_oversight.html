{% extends "principal/principal_layout.html" %}
{% block title %}Compliance Oversight{% endblock %}
{% block page_title %}Compliance Oversight{% endblock %}
{% block content %}
<div class="container-fluid" id="complianceOversight">
    <div class="text-center py-5"><div class="spinner-border text-primary"></div></div>
</div>
{% endblock %}
{% block custom_js %}
<script>
async function loadData() {
    const res = await fetch("/principal/api/compliance", { headers: { "Authorization": "Bearer " + localStorage.getItem('access_token') } });
    const s = await res.json();
    const c = document.getElementById("complianceOversight");
    c.innerHTML = `
        <div class="row g-4 mb-4">
            <div class="col-md-4" data-aos="zoom-in">
                <div class="card border-0 shadow-sm rounded-4 p-3 bg-primary text-white h-100">
                    <div><p class="mb-1 opacity-75">Pending Compliance Actions</p><h2 class="mb-0">${s.pending_compliance}</h2></div>
                </div>
            </div>
            <div class="col-md-4" data-aos="zoom-in" data-aos-delay="100">
                <div class="card border-0 shadow-sm rounded-4 p-3 ${s.overdue_compliance > 0 ? 'bg-danger' : 'bg-success'} text-white h-100">
                    <div><p class="mb-1 opacity-75">Overdue Compliance</p><h2 class="mb-0">${s.overdue_compliance}</h2></div>
                </div>
            </div>
            <div class="col-md-4" data-aos="zoom-in" data-aos-delay="200">
                <div class="card border-0 shadow-sm rounded-4 p-3 bg-warning text-white h-100">
                    <div><p class="mb-1 opacity-75">Documents Pending Review</p><h2 class="mb-0">${s.pending_docs}</h2></div>
                </div>
            </div>
        </div>`;
    AOS.init();
}
loadData();
</script>
{% endblock %}
