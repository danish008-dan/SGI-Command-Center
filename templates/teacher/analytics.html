<!-- templates/teacher/analytics.html -->
{% extends "teacher/teacher_layout.html" %}
{% block title %}Teaching Analytics{% endblock %}
{% block page_title %}Teaching Analytics{% endblock %}
{% block content %}
<div class="container-fluid" id="analyticsContainer">
    <div class="text-center py-5"><div class="spinner-border text-primary"></div></div>
</div>
{% endblock %}
{% block custom_js %}
<script>
async function loadData() {
    const res = await fetch("/teacher/api/analytics/teaching", { headers: { "Authorization": "Bearer " + localStorage.getItem('access_token') } });
    const s = await res.json();
    const c = document.getElementById("analyticsContainer");

    const syllabusPct = s.syllabus_total > 0 ? Math.round((s.syllabus_completed / s.syllabus_total) * 100) : 0;

    c.innerHTML = `
        <div class="row g-3 mb-4">
            <div class="col-md-3" data-aos="zoom-in"><div class="card border-0 shadow-sm rounded-4 p-3 bg-primary text-white h-100 text-center"><h2>${s.subjects || 0}</h2><p class="small mb-0">Subjects</p></div></div>
            <div class="col-md-3" data-aos="zoom-in" data-aos-delay="100"><div class="card border-0 shadow-sm rounded-4 p-3 bg-info text-white h-100 text-center"><h2>${s.classes || 0}</h2><p class="small mb-0">Classes/Sections</p></div></div>
            <div class="col-md-3" data-aos="zoom-in" data-aos-delay="200"><div class="card border-0 shadow-sm rounded-4 p-3 bg-success text-white h-100 text-center"><h2>${s.students || 0}</h2><p class="small mb-0">Students</p></div></div>
            <div class="col-md-3" data-aos="zoom-in" data-aos-delay="300"><div class="card border-0 shadow-sm rounded-4 p-3 bg-warning text-white h-100 text-center"><h2>${s.att_sessions || 0}</h2><p class="small mb-0">Att. Sessions</p></div></div>
        </div>
        <div class="row g-4">
            <div class="col-md-6" data-aos="fade-up">
                <div class="card shadow-sm h-100">
                    <div class="card-header bg-white py-3"><h5 class="mb-0">Assessment & Syllabus Ops</h5></div>
                    <div class="card-body">
                        <ul class="list-group list-group-flush">
                            <li class="list-group-item d-flex justify-content-between">Pending Marks Drafts: <b class="text-warning">${s.pending_marks || 0}</b></li>
                            <li class="list-group-item d-flex justify-content-between">Assignments Created: <b>${s.assignments || 0}</b></li>
                            <li class="list-group-item d-flex justify-content-between">Lesson Plans: <b>${s.lesson_plans || 0}</b></li>
                            <li class="list-group-item d-flex justify-content-between">Syllabus Completed: <b class="text-success">${s.syllabus_completed || 0} / ${s.syllabus_total || 0}</b></li>
                        </ul>
                        <div class="mt-3">
                            <label class="small text-muted">Overall Syllabus Coverage (${syllabusPct}%)</label>
                            <div class="progress" style="height: 8px;"><div class="progress-bar bg-success" style="width: ${syllabusPct}%"></div></div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-6" data-aos="fade-up" data-aos-delay="100">
                <div class="card shadow-sm h-100">
                    <div class="card-header bg-white py-3"><h5 class="mb-0">Attendance Intelligence</h5></div>
                    <div class="card-body" id="attIntelBody"><div class="spinner-border spinner-border-sm"></div></div>
                </div>
            </div>
        </div>
    `;
    AOS.init();
    loadAttIntel();
}

async function loadAttIntel() {
    const res = await fetch("/teacher/api/analytics/attendance", { headers: { "Authorization": "Bearer " + localStorage.getItem('access_token') } });
    const data = await res.json();
    const body = document.getElementById("attIntelBody");

    if(data.subjects.length === 0) { body.innerHTML = '<p class="text-muted">No data</p>'; return; }
    let html = `<table class="table table-sm"><thead><tr><th>Subject</th><th class="text-center">Present</th><th class="text-center">Absent</th><th class="text-center">Avg %</th></tr></thead><tbody>`;
    data.subjects.forEach(s => {
        let color = s.avg_attendance >= 75 ? 'success' : 'danger';
        html += `<tr><td>${s.subject_name} (Sec ${s.section})</td><td class="text-center text-success">${s.present_count}</td><td class="text-center text-danger">${s.absent_count}</td><td class="text-center fw-bold text-${color}">${s.avg_attendance}%</td></tr>`;
    });
    body.innerHTML = html + '</tbody></table>';
}
loadData();
</script>
{% endblock %}
