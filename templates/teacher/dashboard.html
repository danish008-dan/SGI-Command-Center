<!-- templates/teacher/dashboard.html -->
{% extends "teacher/teacher_layout.html" %}
{% block title %}Teacher Dashboard{% endblock %}
{% block page_title %}Executive Dashboard{% endblock %}

{% block content %}
<div class="container-fluid" id="dashContent">
    <div class="text-center py-5">
        <div class="spinner-border text-primary"></div>
        <p class="mt-2 text-muted">Loading Dashboard...</p>
    </div>
</div>
{% endblock %}

{% block custom_js %}
<script>
function getToken() { return localStorage.getItem("access_token"); }

async function loadDashboard() {
    const token = getToken();
    if (!token) { window.location.href = "/login"; return; }

    try {
        const res = await fetch("/teacher/api/dashboard", { headers: { "Authorization": "Bearer " + token } });
        if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);

        const data = await res.json();
        console.log("Dashboard Data:", data); // Check console to see what backend returned

        // Safe fallback: if backend returns old format, adapt to it
        const s = data.stats || data || {};
        const todayClasses = data.today_classes || [];

        const container = document.getElementById("dashContent");

        let todayHtml = '<p class="text-muted text-center py-3">No classes scheduled for today.</p>';
        if(todayClasses.length > 0) {
            todayHtml = `<div class="list-group">`;
            todayClasses.forEach(c => {
                todayHtml += `
                    <div class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="mb-0 text-primary">${c.subject_name || 'N/A'}</h6>
                            <small class="text-muted">Sem ${c.semester || ''} - Sec ${c.section || ''} | Room: ${c.room_number || 'N/A'}</small>
                        </div>
                        <span class="badge bg-info rounded-pill">${c.start_time || ''} - ${c.end_time || ''}</span>
                    </div>
                `;
            });
            todayHtml += '</div>';
        }

        container.innerHTML = `
            <!-- Pending Actions Alert -->
            <div class="alert alert-warning d-flex align-items-center shadow-sm mb-4" role="alert" data-aos="fade-down">
                <i class="bi bi-exclamation-triangle-fill fs-4 me-3"></i>
                <div>
                    <b>Today's Priorities:</b>
                    ${s.pending_marks || 0} Draft Marks Pending Submission,
                    ${s.low_attendance_count || 0} Students below 75% attendance.
                </div>
            </div>

            <!-- Top Stats Cards -->
            <div class="row g-3 mb-4">
                <div class="col-xl-3 col-md-6" data-aos="zoom-in">
                    <a href="/teacher/subjects" class="text-decoration-none">
                        <div class="card border-0 shadow-sm rounded-4 p-3 bg-primary text-white h-100">
                            <div class="d-flex justify-content-between"><div><p class="mb-1 opacity-75 small">My Subjects</p><h4 class="mb-0">${s.subjects || 0}</h4></div><i class="bi bi-journal-bookmark-fill fs-1 opacity-50"></i></div>
                        </div>
                    </a>
                </div>
                <div class="col-xl-3 col-md-6" data-aos="zoom-in" data-aos-delay="100">
                    <div class="card border-0 shadow-sm rounded-4 p-3 bg-success text-white h-100">
                        <div class="d-flex justify-content-between"><div><p class="mb-1 opacity-75 small">Today's Classes</p><h4 class="mb-0">${s.classes_today || 0}</h4></div><i class="bi bi-calendar-day-fill fs-1 opacity-50"></i></div>
                    </div>
                </div>
                <div class="col-xl-3 col-md-6" data-aos="zoom-in" data-aos-delay="200">
                    <div class="card border-0 shadow-sm rounded-4 p-3 bg-info text-white h-100">
                        <div class="d-flex justify-content-between"><div><p class="mb-1 opacity-75 small">Total Students</p><h4 class="mb-0">${s.students || 0}</h4></div><i class="bi bi-mortarboard-fill fs-1 opacity-50"></i></div>
                    </div>
                </div>
                <div class="col-xl-3 col-md-6" data-aos="zoom-in" data-aos-delay="300">
                    <a href="/teacher/marks" class="text-decoration-none">
                        <div class="card border-0 shadow-sm rounded-4 p-3 bg-warning text-white h-100">
                            <div class="d-flex justify-content-between"><div><p class="mb-1 opacity-75 small">Pending Marks</p><h4 class="mb-0">${s.pending_marks || 0}</h4></div><i class="bi bi-journal-text fs-1 opacity-50"></i></div>
                        </div>
                    </a>
                </div>
            </div>

            <!-- Today's Teaching Schedule -->
            <div class="row g-4">
                <div class="col-lg-7" data-aos="fade-up">
                    <div class="card shadow-sm h-100">
                        <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
                            <h5 class="mb-0 text-primary-custom"><i class="bi bi-calendar-day me-2"></i>Teaching Schedule</h5>
                            <a href="/teacher/timetable" class="btn btn-sm btn-link">Full Timetable</a>
                        </div>
                        <div class="card-body">
                            ${todayHtml}
                        </div>
                    </div>
                </div>

                <!-- Quick Actions -->
                <div class="col-lg-5" data-aos="fade-up" data-aos-delay="100">
                    <div class="card shadow-sm h-100">
                        <div class="card-header bg-white py-3"><h5 class="mb-0 text-primary-custom"><i class="bi bi-lightning-charge me-2"></i>Quick Actions</h5></div>
                        <div class="card-body d-grid gap-2">
                            <a href="/teacher/attendance" class="btn btn-outline-primary text-start"><i class="bi bi-calendar-check me-2"></i> Mark Attendance</a>
                            <a href="/teacher/marks" class="btn btn-outline-primary text-start"><i class="bi bi-journal-text me-2"></i> Enter Marks</a>
                            <a href="/teacher/students" class="btn btn-outline-primary text-start"><i class="bi bi-mortarboard me-2"></i> View My Students</a>
                            <a href="/teacher/ai-tools" class="btn btn-outline-primary text-start"><i class="bi bi-robot me-2"></i> AI Teaching Tools</a>
                        </div>
                    </div>
                </div>
            </div>
        `;
        AOS.init();
    } catch (error) {
        console.error("Dashboard Error:", error);
        document.getElementById("dashContent").innerHTML = `<div class="alert alert-danger">Error loading dashboard. Check console for details.</div>`;
    }
}
loadDashboard();
</script>
{% endblock %}
