<!-- templates/hod/dashboard.html -->
{% extends "hod/hod_layout.html" %}

{% block title %}HOD Dashboard{% endblock %}
{% block page_title %}Executive Dashboard{% endblock %}

{% block content %}

<style>
    html,
    body {
        height: 100%;
        overflow: hidden !important;
    }

    /* Prevent the dashboard page itself from creating a scrollbar */
    body {
        margin: 0;
    }

    /* Main dashboard wrapper */
    #hodDashboard {
        height: calc(100vh - 70px);
        overflow: hidden !important;
        padding-bottom: 10px;
    }

    /* Keep Bootstrap rows from creating unwanted horizontal scroll */
    #hodDashboard .row {
        margin-left: 0;
        margin-right: 0;
    }

    /* Make cards compact enough for viewport */
    #hodDashboard .card {
        overflow: hidden;
    }

    /* Compact table */
    #hodDashboard table {
        margin-bottom: 0;
    }

    /* Prevent text from unexpectedly increasing page height */
    #hodDashboard .list-group-item {
        overflow: hidden;
    }

    /* Loading area */
    #loadingSpinner {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }
    #hodDashboard,
    #hodDashboard * {
        scrollbar-width: none;
    }

    #hodDashboard::-webkit-scrollbar,
    #hodDashboard *::-webkit-scrollbar {
        display: none;
    }
</style>

<div class="container-fluid" id="hodDashboard">

    <div id="loadingSpinner" class="text-center py-5">
        <div class="spinner-border text-primary"></div>
        <p class="mt-2 text-muted">Loading Department Analytics...</p>
    </div>

</div>

{% endblock %}


{% block custom_js %}

<script>

function getToken() {
    return localStorage.getItem("access_token");
}


async function loadDashboard() {

    const token = getToken();

    if (!token) {
        window.location.href = "/login";
        return;
    }

    try {

        const res = await fetch(
            "/hod/api/dashboard",
            {
                headers: {
                    "Authorization": "Bearer " + token
                }
            }
        );


        if (res.status === 401 || res.status === 403) {

            const errData = await res.json();

            document.getElementById("hodDashboard").innerHTML = `
                <div class="alert alert-danger">
                    ${errData.error || "Unauthorized"}
                </div>
            `;

            return;
        }


        const data = await res.json();

        const container = document.getElementById("hodDashboard");

        const s = data.stats;


        /* =====================================================
           Helper for table rows
           ===================================================== */

        const genRows = (arr, cols) => {

            if (!arr || arr.length === 0) {

                return `
                    <tr>
                        <td colspan="${cols}" class="text-center text-muted py-2">
                            No data available
                        </td>
                    </tr>
                `;

            }

            return arr.map((st, i) => `

                <tr style="font-size: 12px;">

                    <td>${i + 1}</td>

                    <td>${st.full_name}</td>

                    <td>${st.enrollment_no}</td>

                    <td class="fw-bold ${
                        st.percentage < 40
                            ? 'text-danger'
                            : 'text-success'
                    }">
                        ${st.percentage}%
                    </td>

                </tr>

            `).join('');

        };


        /* =====================================================
           Recent Notices
           ===================================================== */

        let noticesHtml = `
            <li class="list-group-item border-0 text-muted text-center py-3">
                No notices
            </li>
        `;


        if (
            data.recent_notices &&
            data.recent_notices.length > 0
        ) {

            noticesHtml = data.recent_notices.map(n => `

                <li class="list-group-item px-0 py-2 border-0">

                    <small class="text-muted">
                        ${
                            n.posted_on
                                ? new Date(n.posted_on).toLocaleDateString()
                                : ''
                        }
                    </small>

                    <p class="mb-0 fw-bold text-dark">
                        ${n.title}
                    </p>

                </li>

            `).join('');

        }


        /* =====================================================
           Upcoming Events
           ===================================================== */

        let eventsHtml = `
            <li class="list-group-item border-0 text-muted text-center py-3">
                No events scheduled
            </li>
        `;


        if (
            data.upcoming_events &&
            data.upcoming_events.length > 0
        ) {

            eventsHtml = data.upcoming_events.map(e => `

                <li class="list-group-item px-0 py-2 border-0">

                    <small class="text-muted">
                        ${
                            e.event_date
                                ? new Date(e.event_date).toLocaleDateString()
                                : ''
                        }
                    </small>

                    <p class="mb-0 fw-bold text-dark">
                        ${e.event_name}
                    </p>

                    <small class="text-muted">
                        <i class="bi bi-geo-alt"></i>
                        ${e.venue || 'N/A'}
                    </small>

                </li>

            `).join('');

        }


        /* =====================================================
           Attendance Color
           ===================================================== */

        let attColor =
            data.avg_attendance >= 75
                ? 'bg-success'
                : 'bg-danger';


        let attTextColor =
            data.avg_attendance >= 75
                ? 'text-success'
                : 'text-danger';


        /* =====================================================
           DASHBOARD HTML
           ===================================================== */

        container.innerHTML = `

            <!-- =================================================
                 Pending Actions Alert
                 ================================================= -->

            <div
                class="alert alert-warning d-flex align-items-center shadow-sm"
                role="alert"
                data-aos="fade-down"
            >

                <i class="bi bi-exclamation-triangle-fill fs-4 me-3"></i>

                <div>

                    <b>Today's Priorities:</b>

                    ${data.pending_leaves_count} Pending Leaves,

                    ${data.pending_marks_count} Marks Verifications,

                    ${data.low_attendance_count}
                    Students below 75% attendance,

                    ${data.pending_maintenance_count}
                    Maintenance Requests awaiting Admin.

                </div>

            </div>


            <!-- =================================================
                 TOP STATS CARDS
                 ================================================= -->

            <div class="row g-3 mb-4">

                <!-- Total Students -->

                <div
                    class="col-xl-3 col-md-6"
                    data-aos="zoom-in"
                >

                    <a
                        href="/hod/students"
                        class="text-decoration-none"
                    >

                        <div
                            class="card border-0 shadow-sm rounded-4 p-3 bg-primary text-white h-100"
                        >

                            <div class="d-flex justify-content-between">

                                <div>

                                    <p class="mb-1 opacity-75 small">
                                        Total Students
                                    </p>

                                    <h4 class="mb-0">
                                        ${s.students}
                                    </h4>

                                </div>

                                <i class="bi bi-mortarboard-fill fs-1 opacity-50"></i>

                            </div>

                        </div>

                    </a>

                </div>


                <!-- Total Faculty -->

                <div
                    class="col-xl-3 col-md-6"
                    data-aos="zoom-in"
                    data-aos-delay="100"
                >

                    <div
                        class="card border-0 shadow-sm rounded-4 p-3 bg-success text-white h-100"
                    >

                        <div class="d-flex justify-content-between">

                            <div>

                                <p class="mb-1 opacity-75 small">
                                    Total Faculty
                                </p>

                                <h4 class="mb-0">
                                    ${s.teachers}
                                </h4>

                            </div>

                            <i class="bi bi-person-badge-fill fs-1 opacity-50"></i>

                        </div>

                    </div>

                </div>


                <!-- Total Subjects -->

                <div
                    class="col-xl-3 col-md-6"
                    data-aos="zoom-in"
                    data-aos-delay="200"
                >

                    <div
                        class="card border-0 shadow-sm rounded-4 p-3 bg-warning text-white h-100"
                    >

                        <div class="d-flex justify-content-between">

                            <div>

                                <p class="mb-1 opacity-75 small">
                                    Total Subjects
                                </p>

                                <h4 class="mb-0">
                                    ${s.subjects}
                                </h4>

                            </div>

                            <i class="bi bi-journal-bookmark-fill fs-1 opacity-50"></i>

                        </div>

                    </div>

                </div>


                <!-- Average Attendance -->

                <div
                    class="col-xl-3 col-md-6"
                    data-aos="zoom-in"
                    data-aos-delay="300"
                >

                    <a
                        href="/hod/attendance"
                        class="text-decoration-none"
                    >

                        <div
                            class="card border-0 shadow-sm rounded-4 p-3 bg-info text-white h-100"
                        >

                            <div class="d-flex justify-content-between">

                                <div>

                                    <p class="mb-1 opacity-75 small">
                                        Avg Attendance
                                    </p>

                                    <h4 class="mb-0">
                                        ${data.avg_attendance}%
                                    </h4>

                                </div>

                                <i class="bi bi-calendar-check-fill fs-1 opacity-50"></i>

                            </div>

                        </div>

                    </a>

                </div>

            </div>


            <!-- =================================================
                 DEPARTMENT OPERATIONS
                 ================================================= -->

            <h6
                class="text-uppercase text-muted fw-bold mb-3 mt-4"
                data-aos="fade-up"
            >
                Department Operations
            </h6>


            <div class="row g-3 mb-4">

                <!-- Recent Notices -->

                <div
                    class="col-md-4"
                    data-aos="fade-up"
                >

                    <div class="card shadow-sm h-100">

                        <div
                            class="card-header bg-white py-2 d-flex justify-content-between align-items-center"
                        >

                            <h6 class="mb-0 text-primary">

                                <i class="bi bi-megaphone me-1"></i>

                                Recent Notices

                            </h6>

                            <a
                                href="/hod/notices"
                                class="btn btn-sm btn-link p-0"
                            >
                                View All
                            </a>

                        </div>


                        <div class="card-body p-2">

                            <ul class="list-group list-group-flush">

                                ${noticesHtml}

                            </ul>

                        </div>

                    </div>

                </div>


                <!-- Upcoming Events -->

                <div
                    class="col-md-4"
                    data-aos="fade-up"
                    data-aos-delay="100"
                >

                    <div class="card shadow-sm h-100">

                        <div
                            class="card-header bg-white py-2 d-flex justify-content-between align-items-center"
                        >

                            <h6 class="mb-0 text-success">

                                <i class="bi bi-calendar-event me-1"></i>

                                Upcoming Events

                            </h6>

                            <a
                                href="/hod/events"
                                class="btn btn-sm btn-link p-0"
                            >
                                View All
                            </a>

                        </div>


                        <div class="card-body p-2">

                            <ul class="list-group list-group-flush">

                                ${eventsHtml}

                            </ul>

                        </div>

                    </div>

                </div>


                <!-- Maintenance -->

                <div
                    class="col-md-4"
                    data-aos="fade-up"
                    data-aos-delay="200"
                >

                    <div class="card shadow-sm h-100">

                        <div
                            class="card-header bg-white py-2 d-flex justify-content-between align-items-center"
                        >

                            <h6 class="mb-0 text-warning">

                                <i class="bi bi-tools me-1"></i>

                                Maintenance

                            </h6>

                            <a
                                href="/hod/maintenance"
                                class="btn btn-sm btn-link p-0"
                            >
                                Track
                            </a>

                        </div>


                        <div
                            class="card-body d-flex flex-column align-items-center justify-content-center"
                        >

                            <h1 class="display-4 fw-bold text-warning mb-0">
                                ${data.pending_maintenance_count}
                            </h1>

                            <p class="text-muted small">
                                Requests Submitted
                            </p>

                            <a
                                href="/hod/maintenance"
                                class="btn btn-sm btn-outline-warning mt-2"
                            >
                                View Requests
                            </a>

                        </div>

                    </div>

                </div>

            </div>


            <!-- =================================================
                 ACADEMIC HEALTH & RISK
                 ================================================= -->

            <h6
                class="text-uppercase text-muted fw-bold mb-3 mt-4"
                data-aos="fade-up"
            >
                Academic Health & Risk
            </h6>


            <div class="row g-3 mb-4">

                <!-- Health Indicators -->

                <div
                    class="col-md-6"
                    data-aos="fade-up"
                >

                    <div class="card shadow-sm h-100 p-4">

                        <h6 class="mb-3">

                            <i class="bi bi-activity text-primary me-1"></i>

                            Department Health Indicators

                        </h6>


                        <!-- Attendance -->

                        <div class="mb-3">

                            <div class="d-flex justify-content-between mb-1">

                                <span class="small fw-bold">
                                    Overall Attendance
                                </span>

                                <span
                                    class="small fw-bold ${attTextColor}"
                                >
                                    ${data.avg_attendance}%
                                </span>

                            </div>


                            <div
                                class="progress"
                                style="height: 8px;"
                            >

                                <div
                                    class="progress-bar ${attColor}"
                                    role="progressbar"
                                    style="width: ${data.avg_attendance}%;"
                                    aria-valuenow="${data.avg_attendance}"
                                    aria-valuemin="0"
                                    aria-valuemax="100"
                                ></div>

                            </div>


                            <small class="text-danger">
                                ⚠️
                                ${data.low_attendance_count}
                                students below 75% threshold

                            </small>

                        </div>


                        <!-- Marks Completion -->

                        <div class="mb-3">

                            <div class="d-flex justify-content-between mb-1">

                                <span class="small fw-bold">
                                    Marks Submission Completion
                                </span>

                                <span class="small fw-bold text-primary">
                                    ${data.marks_completion_percentage}%
                                </span>

                            </div>


                            <div
                                class="progress"
                                style="height: 8px;"
                            >

                                <div
                                    class="progress-bar bg-primary"
                                    role="progressbar"
                                    style="width: ${data.marks_completion_percentage}%;"
                                    aria-valuenow="${data.marks_completion_percentage}"
                                    aria-valuemin="0"
                                    aria-valuemax="100"
                                ></div>

                            </div>


                            <small class="text-muted">

                                📝
                                ${data.pending_marks_count}
                                subjects pending verification

                            </small>

                        </div>

                    </div>

                </div>


                <!-- Pending Approvals -->

                <div
                    class="col-md-6"
                    data-aos="fade-up"
                    data-aos-delay="100"
                >

                    <div class="card shadow-sm h-100">

                        <div
                            class="card-header bg-white py-2 d-flex justify-content-between align-items-center"
                        >

                            <h6 class="mb-0 text-danger">

                                <i class="bi bi-clipboard-check me-1"></i>

                                Pending Approvals

                            </h6>

                            <a
                                href="/hod/approvals"
                                class="btn btn-sm btn-link p-0"
                            >
                                Go to Center
                            </a>

                        </div>


                        <div
                            class="card-body d-flex align-items-center justify-content-around text-center"
                        >

                            <div>

                                <h3 class="mb-0 text-warning">
                                    ${data.pending_leaves_count}
                                </h3>

                                <small class="text-muted d-block">
                                    Faculty Leaves
                                </small>

                            </div>


                            <div class="vr"></div>


                            <div>

                                <h3 class="mb-0 text-primary">
                                    ${data.pending_marks_count}
                                </h3>

                                <small class="text-muted d-block">
                                    Marks Verif.
                                </small>

                            </div>


                            <div class="vr"></div>


                            <div>

                                <h3 class="mb-0 text-info">
                                    ${data.pending_maintenance_count}
                                </h3>

                                <small class="text-muted d-block">
                                    Maint. Reqs
                                </small>

                            </div>

                        </div>

                    </div>

                </div>

            </div>


            <!-- =================================================
                 STUDENT PERFORMANCE
                 ================================================= -->

            <h6
                class="text-uppercase text-muted fw-bold mb-3 mt-4"
                data-aos="fade-up"
            >
                Student Performance
            </h6>


            <div class="row g-3 mb-3">

                <!-- Top Performers -->

                <div
                    class="col-md-6"
                    data-aos="fade-up"
                >

                    <div class="card shadow-sm h-100">

                        <div class="card-header bg-white py-2">

                            <h6 class="mb-0 text-success">

                                <i class="bi bi-trophy-fill me-1"></i>

                                Top Performers

                            </h6>

                        </div>


                        <div class="card-body p-0">

                            <table
                                class="table table-hover table-sm align-middle mb-0"
                            >

                                <thead class="table-light">

                                    <tr>

                                        <th>#</th>
                                        <th>Student</th>
                                        <th>Enrollment</th>
                                        <th class="text-center">
                                            Marks %
                                        </th>

                                    </tr>

                                </thead>


                                <tbody>

                                    ${genRows(
                                        data.top_performers,
                                        4
                                    )}

                                </tbody>

                            </table>

                        </div>

                    </div>

                </div>


                <!-- Weak Students -->

                <div
                    class="col-md-6"
                    data-aos="fade-up"
                    data-aos-delay="100"
                >

                    <div class="card shadow-sm h-100">

                        <div class="card-header bg-white py-2">

                            <h6 class="mb-0 text-danger">

                                <i class="bi bi-exclamation-triangle-fill me-1"></i>

                                Weak Students

                            </h6>

                        </div>


                        <div class="card-body p-0">

                            <table
                                class="table table-hover table-sm align-middle mb-0"
                            >

                                <thead class="table-light">

                                    <tr>

                                        <th>#</th>
                                        <th>Student</th>
                                        <th>Enrollment</th>
                                        <th class="text-center">
                                            Marks %
                                        </th>

                                    </tr>

                                </thead>


                                <tbody>

                                    ${genRows(
                                        data.weak_students,
                                        4
                                    )}

                                </tbody>

                            </table>

                        </div>

                    </div>

                </div>

            </div>


            <!-- =================================================
                 SUBJECT PERFORMANCE & FACULTY WORKLOAD
                 ================================================= -->

            <div class="row g-3">

                <!-- Subject Performance -->

                <div
                    class="col-md-6"
                    data-aos="fade-up"
                >

                    <div class="card shadow-sm h-100">

                        <div class="card-header bg-white py-2">

                            <h6 class="mb-0 text-primary">

                                <i class="bi bi-graph-up me-1"></i>

                                Subject Performance

                            </h6>

                        </div>


                        <div class="card-body p-0">

                            <table
                                class="table table-hover table-sm align-middle mb-0"
                            >

                                <thead class="table-light">

                                    <tr>

                                        <th>Subject</th>
                                        <th>Code</th>
                                        <th class="text-center">
                                            Avg %
                                        </th>

                                    </tr>

                                </thead>


                                <tbody style="font-size: 12px;">

                                    ${
                                        (
                                            data.subject_performance &&
                                            data.subject_performance.length > 0
                                        )

                                        ?

                                        data.subject_performance
                                            .map(sub => `

                                                <tr>

                                                    <td>
                                                        ${sub.subject_name}
                                                    </td>

                                                    <td>
                                                        ${sub.subject_code}
                                                    </td>

                                                    <td
                                                        class="fw-bold ${
                                                            sub.avg_marks < 40
                                                                ? 'text-danger'
                                                                : 'text-success'
                                                        }"
                                                    >
                                                        ${sub.avg_marks}%
                                                    </td>

                                                </tr>

                                            `)
                                            .join('')

                                        :

                                        `
                                            <tr>

                                                <td
                                                    colspan="3"
                                                    class="text-center text-muted py-2"
                                                >
                                                    No data
                                                </td>

                                            </tr>
                                        `
                                    }

                                </tbody>

                            </table>

                        </div>

                    </div>

                </div>


                <!-- Faculty Workload -->

                <div
                    class="col-md-6"
                    data-aos="fade-up"
                    data-aos-delay="100"
                >

                    <div class="card shadow-sm h-100">

                        <div class="card-header bg-white py-2">

                            <h6 class="mb-0 text-info">

                                <i class="bi bi-briefcase-fill me-1"></i>

                                Faculty Workload

                            </h6>

                        </div>


                        <div class="card-body p-0">

                            <table
                                class="table table-hover table-sm align-middle mb-0"
                            >

                                <thead class="table-light">

                                    <tr>

                                        <th>Teacher</th>
                                        <th>Designation</th>
                                        <th class="text-center">
                                            Subjects
                                        </th>

                                    </tr>

                                </thead>


                                <tbody style="font-size: 12px;">

                                    ${
                                        (
                                            data.faculty_workload &&
                                            data.faculty_workload.length > 0
                                        )

                                        ?

                                        data.faculty_workload
                                            .map(t => `

                                                <tr>

                                                    <td>
                                                        ${t.teacher_name}
                                                    </td>

                                                    <td>
                                                        ${t.designation}
                                                    </td>

                                                    <td
                                                        class="fw-bold text-primary"
                                                    >
                                                        ${t.subject_count}
                                                    </td>

                                                </tr>

                                            `)
                                            .join('')

                                        :

                                        `
                                            <tr>

                                                <td
                                                    colspan="3"
                                                    class="text-center text-muted py-2"
                                                >
                                                    No data
                                                </td>

                                            </tr>
                                        `
                                    }

                                </tbody>

                            </table>

                        </div>

                    </div>

                </div>

            </div>

        `;
        AOS.init();

    }

    catch (error) {

        document.getElementById("hodDashboard").innerHTML = `

            <div class="alert alert-danger">

                Error loading dashboard:
                ${error.message}

            </div>

        `;

    }

}
loadDashboard();

</script>

{% endblock %}
