{% extends "hod/hod_layout.html" %}
{% block title %}Department Notices{% endblock %}
{% block page_title %}Notices & Communication{% endblock %}
{% block content %}
<div class="container-fluid">
    <div class="card shadow-sm mb-4" data-aos="fade-up">
        <div class="card-header bg-white py-3"><h5 class="mb-0">Create Department Notice</h5></div>
        <div class="card-body">
            <form id="createNoticeForm">
                <div class="mb-3"><input type="text" class="form-control" name="title" placeholder="Notice Title" required></div>
                <div class="mb-3">
                    <select class="form-select" name="category" required>
                        <option value="General">General</option>
                        <option value="Academic">Academic</option>
                        <option value="Exam">Exam</option>
                        <option value="Event">Event</option>
                    </select>
                </div>
                <div class="mb-3"><textarea class="form-control" name="description" rows="3" placeholder="Description" required></textarea></div>
                <button type="submit" class="btn btn-primary">Publish Notice</button>
            </form>
        </div>
    </div>
    <div class="card shadow-sm" data-aos="fade-up">
        <div class="card-header bg-white py-3"><h5 class="mb-0">Department Notices</h5></div>
        <div class="card-body" id="noticesBody">
            <div class="text-center py-5"><div class="spinner-border text-primary"></div></div>
        </div>
    </div>
</div>
{% endblock %}
{% block custom_js %}
<script>
async function loadData() {
    const res = await fetch("/hod/api/notices", { headers: { "Authorization": "Bearer " + localStorage.getItem('access_token') } });
    const data = await res.json();
    const body = document.getElementById("noticesBody");
    if(data.notices.length === 0) { body.innerHTML = '<p class="text-muted text-center">No notices found.</p>'; return; }
    let html = '<div class="list-group">';
    data.notices.forEach(n => {
        html += `<div class="list-group-item list-group-item-action"><div class="d-flex w-100 justify-content-between"><h6 class="mb-1">${n.title}</h6><small>${new Date(n.posted_on).toLocaleDateString()}</small></div><p class="mb-1 text-muted small">${n.description}</p><small class="badge bg-primary">${n.category}</small></div>`;
    });
    html += '</div>';
    body.innerHTML = html;
}
document.getElementById("createNoticeForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const formData = new URLSearchParams(new FormData(e.target));
    const res = await fetch("/hod/api/notices/create", { method: "POST", headers: { "Authorization": "Bearer " + localStorage.getItem('access_token') }, body: formData });
    const data = await res.json();
    alert(data.message);
    if(data.success) { e.target.reset(); loadData(); }
});
loadData();
</script>
{% endblock %}
