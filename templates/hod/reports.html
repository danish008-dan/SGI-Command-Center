<!-- templates/hod/reports.html -->
{% extends "hod/hod_layout.html" %}
{% block title %}Department Reports{% endblock %}
{% block page_title %}Executive Summary Report{% endblock %}
{% block content %}
<div class="container-fluid" id="reportsDashboard">
    <div class="text-center py-5"><div class="spinner-border text-primary"></div></div>
</div>
{% endblock %}
{% block custom_js %}
<script>
async function loadData() {
    const res = await fetch("/hod/api/reports", { headers: { "Authorization": "Bearer " + localStorage.getItem('access_token') } });
    const data = await res.json();
    const c = document.getElementById("reportsDashboard");
    const s = data.stats, a = data.academic;

    c.innerHTML = `
        <div class="alert alert-info shadow-sm" data-aos="fade-down">
            <h5 class="mb-1"><i class="bi bi-file-earmark-bar-graph"></i> Department Executive Summary</h5>
            <p class="mb-0 small">Consolidated view of department health and pending actions.</p>
        </div>
        <div class="row g-4">
            <div class="col-md-6 col-xl-4" data-aos="zoom-in">
                <div class="card shadow-sm h-100">
                    <div class="card-header bg-white"><h6 class="mb-0 text-primary">General & Academic</h6></div>
                    <ul class="list-group list-group-flush">
                        <li class="list-group-item d-flex justify-content-between">Total Students: <b>${s.students}</b></li>
                        <li class="list-group-item d-flex justify-content-between">Total Faculty: <b>${s.teachers}</b></li>
                        <li class="list-group-item d-flex justify-content-between">Total Subjects: <b>${data.total_subjects}</b></li>
                        <li class="list-group-item d-flex justify-content-between">Avg Attendance: <b>${a.avg_attendance}%</b></li>
                        <li class="list-group-item d-flex justify-content-between">Low Attendance Students: <b class="text-danger">${a.low_attendance_count}</b></li>
                    </ul>
                </div>
            </div>
            <div class="col-md-6 col-xl-4" data-aos="zoom-in" data-aos-delay="100">
                <div class="card shadow-sm h-100">
                    <div class="card-header bg-white"><h6 class="mb-0 text-warning">Pending Actions</h6></div>
                    <ul class="list-group list-group-flush">
                        <li class="list-group-item d-flex justify-content-between">Pending Faculty Leaves: <b class="text-warning">${data.pending_leaves_count}</b></li>
                        <li class="list-group-item d-flex justify-content-between">Subjects with Pending Marks: <b class="text-primary">${data.pending_marks_count}</b></li>
                    </ul>
                </div>
            </div>
            <div class="col-md-6 col-xl-4" data-aos="zoom-in" data-aos-delay="200">
                <div class="card shadow-sm h-100">
                    <div class="card-header bg-white"><h6 class="mb-0 text-success">Quick Links</h6></div>
                    <div class="card-body d-flex flex-column gap-2">
                        <a href="/hod/approvals" class="btn btn-sm btn-outline-primary"><i class="bi bi-clipboard-check"></i> Go to Approval Center</a>
                        <a href="/hod/attendance" class="btn btn-sm btn-outline-danger"><i class="bi bi-calendar-check"></i> View Attendance Issues</a>
                        <a href="/hod/ai-assistant" class="btn btn-sm btn-outline-success"><i class="bi bi-robot"></i> Ask AI Assistant</a>
                    </div>
                </div>
            </div>
        </div>`;
    AOS.init();
}
loadData();
</script>
{% endblock %}
