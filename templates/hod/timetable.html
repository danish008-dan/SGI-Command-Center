<!-- templates/hod/timetable.html -->
{% extends "hod/hod_layout.html" %}

{% block title %}Department Timetable{% endblock %}
{% block page_title %}Weekly Timetable{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="card shadow-sm" data-aos="fade-up">
        <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
            <h5 class="mb-0">Department Schedule</h5>
            <div class="d-flex gap-2">
                <select id="semFilter" class="form-select form-select-sm" style="width: 100px;">
                    <option value="">All Sem</option>
                    <option value="1">Sem 1</option><option value="2">Sem 2</option><option value="3">Sem 3</option>
                    <option value="4">Sem 4</option><option value="5">Sem 5</option><option value="6">Sem 6</option>
                </select>
                <input type="text" id="secFilter" class="form-control form-control-sm" placeholder="Sec" style="width: 80px;">
                <button class="btn btn-sm btn-primary" onclick="loadTimetable()"><i class="bi bi-search"></i></button>
            </div>
        </div>
        <div class="card-body" id="timetableBody">
            <div class="text-center py-5"><div class="spinner-border text-primary"></div></div>
        </div>
    </div>
</div>
{% endblock %}

{% block custom_js %}
<script>
function getToken() { return localStorage.getItem("access_token"); }

async function loadTimetable() {
    const sem = document.getElementById("semFilter").value;
    const sec = document.getElementById("secFilter").value;
    const body = document.getElementById("timetableBody");
    body.innerHTML = `<div class="text-center py-5"><div class="spinner-border text-primary"></div></div>`;

    let url = `/hod/api/timetable?`;
    if(sem) url += `semester=${sem}&`;
    if(sec) url += `section=${sec}`;

    try {
        const res = await fetch(url, { headers: { "Authorization": "Bearer " + getToken() } });
        const data = await res.json();

        if(data.timetable.length === 0) {
            body.innerHTML = '<p class="text-center text-muted py-4">No timetable entries found for selected filters.</p>';
            return;
        }

        // Group by Day
        const days = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
        let html = '<div class="table-responsive"><table class="table table-bordered table-sm"><thead class="table-light"><tr><th>Day</th><th>Time</th><th>Subject</th><th>Faculty</th><th>Room</th><th>Section</th></tr></thead><tbody>';

        days.forEach(day => {
            const entries = data.timetable.filter(t => t.day_of_week === day);
            if(entries.length > 0) {
                entries.forEach((e, i) => {
                    html += `<tr>
                        ${i === 0 ? `<td rowspan="${entries.length}" class="fw-bold align-middle bg-light">${day}</td>` : ''}
                        <td>${e.start_time} - ${e.end_time}</td>
                        <td>${e.subject_name} <small class="text-muted">(${e.subject_code})</small></td>
                        <td>${e.teacher_name || 'TBD'}</td>
                        <td>${e.room_number} (${e.room_name})</td>
                        <td>${e.section} (Sem ${e.semester})</td>
                    </tr>`;
                });
            }
        });

        html += '</tbody></table></div>';
        body.innerHTML = html;
    } catch(err) {
        body.innerHTML = '<div class="alert alert-danger">Failed to load timetable.</div>';
    }
}
loadTimetable();
</script>
{% endblock %}
