<!-- templates/hod/faculty_profile.html -->
{% extends "hod/hod_layout.html" %}

{% block title %}Faculty Profile{% endblock %}
{% block page_title %}Faculty Academic Profile{% endblock %}

{% block content %}
<div class="container-fluid mb-3">
    <a href="/hod/faculty" class="btn btn-secondary btn-sm shadow-sm">
        <i class="bi bi-arrow-left"></i> Back to Faculty List
    </a>
</div>

<div class="container-fluid" id="profileContainer">
    <div class="text-center py-5"><div class="spinner-border text-primary"></div><p class="mt-2 text-muted">Loading Profile...</p></div>
</div>
{% endblock %}

{% block custom_js %}
<script>
function getToken() { return localStorage.getItem("access_token"); }
const teacherId = "{{ teacher_id }}";

async function loadProfile() {
    try {
        const res = await fetch(`/hod/api/faculty/${teacherId}`, { headers: { "Authorization": "Bearer " + getToken() } });
        if(!res.ok) throw new Error("Unauthorized or not found");
        const p = await res.json();

        const container = document.getElementById("profileContainer");
        container.innerHTML = `
            <div class="row g-4">
                <!-- Basic Info -->
                <div class="col-md-4" data-aos="fade-right">
                    <div class="card shadow-sm h-100">
                        <div class="card-header bg-white py-3"><h5 class="mb-0 text-primary">${p.full_name}</h5></div>
                        <div class="card-body">
                            <p><b>Email:</b> ${p.email}</p>
                            <p><b>Department:</b> ${p.department_name}</p>
                            <p><b>Designation:</b> ${p.designation || '-'}</p>
                            <p><b>Qualification:</b> ${p.qualification || '-'}</p>
                            <p><b>Experience:</b> ${p.experience || '0'} Years</p>
                        </div>
                    </div>
                </div>

                <!-- Assigned Subjects -->
                <div class="col-md-8" data-aos="fade-left">
                    <div class="card shadow-sm h-100">
                        <div class="card-header bg-white py-3"><h5 class="mb-0">Assigned Subjects</h5></div>
                        <div class="card-body">
                            <div class="table-responsive">
                                <table class="table table-sm table-bordered">
                                    <thead class="table-light"><tr><th>Subject Name</th><th>Code</th><th>Sem</th><th>Type</th><th class="text-center">Hrs/Week</th></tr></thead>
                                    <tbody>
                                        ${p.subjects.map(s => `<tr><td>${s.subject_name}</td><td>${s.subject_code}</td><td>${s.semester}</td><td>${s.subject_type}</td><td class="text-center">${s.classes_per_week}</td></tr>`).join('') || '<tr><td colspan="5" class="text-center text-muted">No subjects assigned</td></tr>'}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Leave History -->
                <div class="col-12" data-aos="fade-up">
                    <div class="card shadow-sm">
                        <div class="card-header bg-white py-3"><h5 class="mb-0">Recent Leave History</h5></div>
                        <div class="card-body">
                            <div class="table-responsive">
                                <table class="table table-sm table-hover">
                                    <thead class="table-light"><tr><th>Type</th><th>From</th><th>To</th><th>Reason</th><th class="text-center">Status</th></tr></thead>
                                    <tbody>
                                        ${p.leaves.map(l => `<tr><td>${l.leave_type}</td><td>${l.from_date}</td><td>${l.to_date}</td><td>${l.reason}</td><td class="text-center"><span class="badge bg-${l.status === 'Approved' ? 'success' : (l.status === 'Rejected' ? 'danger' : 'warning')}">${l.status}</span></td></tr>`).join('') || '<tr><td colspan="5" class="text-center text-muted">No leave records</td></tr>'}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        `;
        AOS.init();
    } catch(err) {
        document.getElementById("profileContainer").innerHTML = `<div class="alert alert-danger">Error loading profile or unauthorized access.</div>`;
    }
}
loadProfile();
</script>
{% endblock %}
