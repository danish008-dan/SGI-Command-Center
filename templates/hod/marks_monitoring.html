{% extends "hod/hod_layout.html" %}
{% block title %}Marks Monitoring{% endblock %}
{% block page_title %}Internal Assessment Monitoring{% endblock %}
{% block content %}
<div class="container-fluid">
    <div class="card shadow-sm" data-aos="fade-up">
        <div class="card-header bg-white py-3"><h5 class="mb-0">Marks Submission Status</h5></div>
        <div class="card-body" id="marksBody">
            <div class="text-center py-5"><div class="spinner-border text-primary"></div></div>
        </div>
    </div>
</div>
{% endblock %}
{% block custom_js %}
<script>
async function loadData() {
    const res = await fetch("/hod/api/marks-monitoring", { headers: { "Authorization": "Bearer " + localStorage.getItem('access_token') } });
    const data = await res.json();
    const body = document.getElementById("marksBody");
    
    if(data.subjects.length === 0) {
        body.innerHTML = '<p class="text-center text-muted py-4">No subjects found.</p>';
        return;
    }

    let html = `<div class="table-responsive"><table class="table table-hover align-middle">
        <thead class="table-light"><tr><th>Subject</th><th>Sem</th><th>Faculty</th><th class="text-center">Total</th><th class="text-center text-warning">Submitted</th><th class="text-center text-success">Verified</th><th class="text-center text-danger">Returned</th></tr></thead>
        <tbody>`;
    
    data.subjects.forEach(s => {
        html += `<tr>
            <td><b>${s.subject_name}</b><br><small class="text-muted">${s.subject_code}</small></td>
            <td>${s.semester}</td>
            <td>${s.teacher_name || 'Unassigned'}</td>
            <td class="text-center">${s.total_records}</td>
            <td class="text-center text-warning fw-bold">${s.submitted_count}</td>
            <td class="text-center text-success fw-bold">${s.verified_count}</td>
            <td class="text-center text-danger fw-bold">${s.returned_count}</td>
        </tr>`;
    });
    
    html += '</tbody></table></div>';
    body.innerHTML = html;
}
loadData();
</script>
{% endblock %}
