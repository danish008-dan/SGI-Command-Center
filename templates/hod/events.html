{% extends "hod/hod_layout.html" %}
{% block title %}Department Events{% endblock %}
{% block page_title %}Events & Activities{% endblock %}
{% block content %}
<div class="container-fluid">
    <div class="card shadow-sm mb-4" data-aos="fade-up">
        <div class="card-header bg-white py-3"><h5 class="mb-0">Schedule Department Event</h5></div>
        <div class="card-body">
            <form id="createEventForm">
                <div class="row g-3">
                    <div class="col-md-6"><input type="text" class="form-control" name="event_name" placeholder="Event Name" required></div>
                    <div class="col-md-3"><input type="date" class="form-control" name="event_date" required></div>
                    <div class="col-md-3"><input type="text" class="form-control" name="venue" placeholder="Venue" required></div>
                    <div class="col-12"><textarea class="form-control" name="description" rows="2" placeholder="Description" required></textarea></div>
                    <div class="col-12"><button type="submit" class="btn btn-primary">Create Event</button></div>
                </div>
            </form>
        </div>
    </div>
    <div class="card shadow-sm" data-aos="fade-up">
        <div class="card-header bg-white py-3"><h5 class="mb-0">Upcoming & Past Events</h5></div>
        <div class="card-body" id="eventsBody">
            <div class="text-center py-5"><div class="spinner-border text-primary"></div></div>
        </div>
    </div>
</div>
{% endblock %}
{% block custom_js %}
<script>
async function loadData() {
    const res = await fetch("/hod/api/events", { headers: { "Authorization": "Bearer " + localStorage.getItem('access_token') } });
    const data = await res.json();
    const body = document.getElementById("eventsBody");
    if(data.events.length === 0) { body.innerHTML = '<p class="text-muted text-center">No events found.</p>'; return; }
    let html = `<div class="table-responsive"><table class="table table-hover"><thead><tr><th>Event</th><th>Date</th><th>Venue</th><th>Status</th></tr></thead><tbody>`;
    data.events.forEach(e => {
        html += `<tr><td><b>${e.event_name}</b><br><small class="text-muted">${e.description}</small></td><td>${new Date(e.event_date).toLocaleDateString()}</td><td>${e.venue}</td><td><span class="badge bg-success">${e.status}</span></td></tr>`;
    });
    html += '</tbody></table></div>';
    body.innerHTML = html;
}
document.getElementById("createEventForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const formData = new URLSearchParams(new FormData(e.target));
    const res = await fetch("/hod/api/events/create", { method: "POST", headers: { "Authorization": "Bearer " + localStorage.getItem('access_token') }, body: formData });
    const data = await res.json();
    alert(data.message);
    if(data.success) { e.target.reset(); loadData(); }
});
loadData();
</script>
{% endblock %}
