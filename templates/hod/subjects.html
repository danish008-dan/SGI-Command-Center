<!-- templates/hod/subjects.html -->
{% extends "hod/hod_layout.html" %}

{% block title %}Subject & Curriculum{% endblock %}
{% block page_title %}Department Subjects{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="card shadow-sm" data-aos="fade-up">
        <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
            <h5 class="mb-0">Subject Master & Allocation</h5>
            <div class="d-flex gap-2">
                <select id="semFilter" class="form-select form-select-sm" style="width: 100px;">
                    <option value="">All Sem</option>
                    <option value="1">Sem 1</option><option value="2">Sem 2</option><option value="3">Sem 3</option>
                    <option value="4">Sem 4</option><option value="5">Sem 5</option><option value="6">Sem 6</option>
                </select>
                <select id="typeFilter" class="form-select form-select-sm" style="width: 120px;">
                    <option value="">All Types</option>
                    <option value="Theory">Theory</option>
                    <option value="Practical">Practical</option>
                    <option value="Lab">Lab</option>
                </select>
                <button class="btn btn-sm btn-primary" onclick="loadSubjects()"><i class="bi bi-search"></i></button>
            </div>
        </div>
        <div class="card-body" id="subjectsBody">
            <div class="text-center py-5"><div class="spinner-border text-primary"></div></div>
        </div>
    </div>
</div>
{% endblock %}

{% block custom_js %}
<script>
function getToken() { return localStorage.getItem("access_token"); }

async function loadSubjects() {
    const sem = document.getElementById("semFilter").value;
    const type = document.getElementById("typeFilter").value;
    const body = document.getElementById("subjectsBody");
    body.innerHTML = `<div class="text-center py-5"><div class="spinner-border text-primary"></div></div>`;

    let url = `/hod/api/subjects?`;
    if(sem) url += `semester=${sem}&`;
    if(type) url += `subject_type=${type}`;

    try {
        const res = await fetch(url, { headers: { "Authorization": "Bearer " + getToken() } });
        const data = await res.json();

        let html = '';
        if(data.unassigned_subjects && data.unassigned_subjects.length > 0) {
            html += `<div class="alert alert-warning"><b><i class="bi bi-exclamation-triangle-fill"></i> Unassigned Subjects:</b> ${data.unassigned_subjects.map(s => s.subject_name + ' (' + s.subject_code + ')').join(', ')}</div>`;
        }

        html += `<div class="table-responsive"><table class="table table-hover align-middle">
            <thead class="table-light"><tr><th>Code</th><th>Subject Name</th><th>Sem</th><th>Type</th><th>Credits</th><th>Assigned Faculty</th><th class="text-center">Status</th></tr></thead>
            <tbody>`;

        data.subjects.forEach(s => {
            html += `<tr>
                <td><b>${s.subject_code}</b></td>
                <td>${s.subject_name}</td>
                <td>${s.semester}</td>
                <td>${s.subject_type}</td>
                <td>${s.credits}</td>
                <td>${s.faculty_name || '<span class="text-danger">Unassigned</span>'}</td>
                <td class="text-center"><span class="badge bg-${s.status === 'Active' ? 'success' : 'secondary'}">${s.status}</span></td>
            </tr>`;
        });

        html += '</tbody></table></div>';
        body.innerHTML = html;
    } catch(err) {
        body.innerHTML = '<div class="alert alert-danger">Failed to load subjects.</div>';
    }
}
loadSubjects();
</script>
{% endblock %}
