{% extends "hod/hod_layout.html" %}
{% block title %}Results Monitoring{% endblock %}
{% block page_title %}Result Approval Status{% endblock %}
{% block content %}
<div class="container-fluid">
    <div class="card shadow-sm" data-aos="fade-up">
        <div class="card-header bg-white py-3"><h5 class="mb-0">Department Result Status</h5></div>
        <div class="card-body" id="resultsBody">
            <div class="text-center py-5"><div class="spinner-border text-primary"></div></div>
        </div>
    </div>
</div>
{% endblock %}
{% block custom_js %}
<script>
async function loadData() {
    const res = await fetch("/hod/api/results-monitoring", { headers: { "Authorization": "Bearer " + localStorage.getItem('access_token') } });
    const data = await res.json();
    const body = document.getElementById("resultsBody");
    
    if(data.statuses.length === 0) {
        body.innerHTML = '<p class="text-center text-muted py-4">No result records found.</p>';
        return;
    }

    let html = `<div class="table-responsive"><table class="table table-hover align-middle">
        <thead class="table-light"><tr><th>Approval Status</th><th>Publication Status</th><th class="text-center">Count</th></tr></thead>
        <tbody>`;
    
    data.statuses.forEach(s => {
        let badgeColor = s.approval_status == 'Approved' ? 'success' : (s.approval_status == 'Rejected' ? 'danger' : 'warning');
        html += `<tr>
            <td><span class="badge bg-${badgeColor}">${s.approval_status}</span></td>
            <td>${s.publication_status}</td>
            <td class="text-center fw-bold fs-5">${s.count}</td>
        </tr>`;
    });
    
    html += '</tbody></table></div>';
    body.innerHTML = html;
}
loadData();
</script>
{% endblock %}
