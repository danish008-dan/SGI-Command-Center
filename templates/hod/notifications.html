<!-- templates/hod/notifications.html -->
{% extends "hod/hod_layout.html" %}
{% block title %}Notifications{% endblock %}
{% block page_title %}Department Alerts{% endblock %}
{% block content %}
<div class="container-fluid" id="notifCenter">
    <div class="text-center py-5"><div class="spinner-border text-primary"></div></div>
</div>
{% endblock %}
{% block custom_js %}
<script>
async function loadData() {
    const res = await fetch("/hod/api/notifications", { headers: { "Authorization": "Bearer " + localStorage.getItem('access_token') } });
    const data = await res.json();
    const c = document.getElementById("notifCenter");

    let html = '<div class="list-group">';
    if(data.notifications.length === 0) {
        html += `<div class="alert alert-success text-center">No active alerts. All systems normal.</div>`;
    } else {
        data.notifications.forEach(n => {
            let sevColor = n.severity === 'Critical' ? 'danger' : (n.severity === 'High' ? 'warning' : 'info');
            html += `
                <a href="${n.link}" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center border-0 shadow-sm mb-2">
                    <div>
                        <h6 class="mb-1 text-${sevColor}">${n.type} Alert</h6>
                        <small class="text-muted">${n.message}</small>
                    </div>
                    <i class="bi bi-chevron-right"></i>
                </a>`;
        });
    }
    html += '</div>';
    c.innerHTML = html;
}
loadData();
</script>
{% endblock %}
