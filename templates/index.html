<!-- templates/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGI Command Center - Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
</head>
<body>

    <!-- Transition Overlay -->
    <div class="transition-overlay" id="transitionOverlay"></div>

    <!-- main-container triggers SGI_Campus.jpg from your CSS -->
    <div class="main-container">
        
        <!-- Transparent Navbar -->
        <nav class="custom-navbar navbar navbar-expand-lg">
            <div class="container">
                <a class="navbar-brand" href="/">SGI Command Center</a>
            </div>
        </nav>

        <!-- Centered Content Area -->
        <main class="home-bg">
            <!-- glass-card gives the premium frosted glass effect -->
            <div class="glass-card text-center" data-aos="fade-down">
                <h1 class="mb-3">SGI Command Center</h1>
                <p class="lead text-muted mb-4">Comprehensive Campus Management System</p>
                <hr class="my-4">
                <!-- Premium Start Button -->
                <a href="/login" class="btn btn-start mt-3" id="getStartedBtn">Get Started</a>
            </div>
        </main>

        <!-- Transparent Footer -->
        <footer class="custom-footer text-center">
            <small>Developed By Danish Khatri</small>
        </footer>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init();

        // Cinematic Transition to Login Page
        document.getElementById("getStartedBtn").addEventListener("click", function(e) {
            e.preventDefault(); // Stop normal navigation
            const overlay = document.getElementById("transitionOverlay");
            overlay.classList.add("active"); // Sweep up animation

            // Wait for animation to finish (600ms) then redirect
            setTimeout(() => {
                window.location.href = "/login";
            }, 600);
        });
    </script>
</body>
</html>
