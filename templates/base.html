<!-- templates/base.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SGI Command Center{% endblock %}</title>

    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- AOS Animations CSS -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <!-- Our Custom Theme CSS -->
    <link href="/static/css/style.css" rel="stylesheet">
</head>
<body>


        <!-- Navbar Placeholder (We will build this in Sprint 6) -->
        <nav class="navbar navbar-expand-lg navbar-dark border-0">
            <div class="container">
                <a class="navbar-brand" href="/">SGI Command Center</a>
            </div>
        </nav>

        <!-- Main Content Area -->
        <div class="content flex-grow-1">
            {% block content %}{% endblock %}
        </div>

        <!-- Footer -->
        <footer class="text-center py-3 text-white border-0">
            SGI_Command_Center - Developed By Danish Khatri with AGNHUB
        </footer>
    </div>

    <!-- Bootstrap 5.3 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- AOS Animations JS -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        // Initialize AOS animations
        AOS.init();
    </script>
</body>
</html>
