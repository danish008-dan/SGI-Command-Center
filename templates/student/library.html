<!-- templates/student/library.html -->
{% extends "student/student_layout.html" %}
{% block title %}My Library{% endblock %}
{% block page_title %}Library Services{% endblock %}

{% block content %}
<div class="container-fluid mb-3">
    <a href="/student/dashboard" class="btn btn-secondary btn-sm shadow-sm">
        <i class="bi bi-arrow-left"></i> Back to Dashboard
    </a>
</div>

<div class="container-fluid">
    <div class="card shadow-sm" data-aos="fade-up">
        <div class="card-header bg-white py-3"><h5 class="mb-0">My Issued Books</h5></div>
        <div class="card-body" id="libBody">
            <div class="text-center py-5"><div class="spinner-border text-primary"></div></div>
        </div>
    </div>
</div>
{% endblock %}

{% block custom_js %}
<script>
async function loadData() {
    const res = await fetch("/student/api/library", { headers: { "Authorization": "Bearer " + localStorage.getItem('access_token') } });
    const data = await res.json();
    const body = document.getElementById("libBody");

    if(data.loans.length === 0) {
        body.innerHTML = '<p class="text-muted text-center py-4">No books currently issued or history found.</p>';
        return;
    }

    let html = `<div class="table-responsive"><table class="table table-hover align-middle">
        <thead class="table-light"><tr><th>Book Title</th><th>Accession No</th><th>Issue Date</th><th>Due Date</th><th>Status</th><th class="text-center">Fine</th></tr></thead>
        <tbody>`;

    data.loans.forEach(l => {
        let statusBadge = l.status === 'Returned' ? 'success' : (l.status === 'Overdue' ? 'danger' : 'primary');
        html += `<tr>
            <td><b>${l.title}</b><br><small class="text-muted">${l.author || ''}</small></td>
            <td>${l.accession_number}</td>
            <td>${l.issue_date}</td>
            <td>${l.due_date || '-'}</td>
            <td><span class="badge bg-${statusBadge}">${l.status}</span></td>
            <td class="text-center fw-bold ${l.fine_amount > 0 ? 'text-danger' : ''}">₹${l.fine_amount || 0}</td>
        </tr>`;
    });

    html += '</tbody></table></div>';
    body.innerHTML = html;
}
loadData();
</script>
{% endblock %}
